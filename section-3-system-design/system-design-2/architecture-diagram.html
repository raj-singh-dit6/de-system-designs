<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <title>Image Processing Platform | AWS Architecture</title>
    <style>
      :root { --ink:#152943; --muted:#5f728b; --line:#cbd7e5; --aws:#ff9900; --blue:#2275d7; --green:#16825d; --purple:#7755c7; --red:#b5473c; --canvas:#f5f8fc; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--canvas); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      main { width:min(1600px,100%); min-height:1000px; margin:auto; padding:42px 56px; background:radial-gradient(circle at 96% 3%,#dcebff 0,transparent 25%),radial-gradient(circle at 5% 92%,#e0f5ec 0,transparent 24%),var(--canvas); }
      header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; }
      .eyebrow { color:#1766bf; font-size:13px; font-weight:750; letter-spacing:.12em; text-transform:uppercase; }
      h1 { margin:7px 0; font-size:35px; letter-spacing:-.035em; }
      .subtitle { margin:0; color:var(--muted); font-size:16px; }
      .badge { padding:9px 13px; border:1px solid #f4c77e; border-radius:999px; background:#fff6e7; color:#945900; font-size:12px; font-weight:750; }
      .legend { display:flex; gap:17px; margin:0 0 14px; color:var(--muted); font-size:11px; }
      .legend span::before { display:inline-block; width:9px; height:9px; margin-right:5px; border-radius:50%; content:""; }
      .l-ingest::before { background:var(--blue); } .l-process::before { background:var(--purple); } .l-store::before { background:var(--green); } .l-control::before { background:var(--red); }
      svg { width:100%; height:auto; min-height:690px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.82); box-shadow:0 12px 28px rgb(37 70 109 / 7%); }
      .zone { fill:#f8fbff; stroke:#c8d9ed; stroke-width:1.4; stroke-dasharray:6 5; } .private { fill:#faf8ff; stroke:#d6caef; stroke-width:1.4; stroke-dasharray:6 5; }
      .box { fill:#fff; stroke:#b9cadc; stroke-width:1.3; rx:11; } .ingest { stroke:#7aaee9; } .process { stroke:#b9a4e3; } .store { stroke:#79c6aa; } .control { stroke:#e5aaa1; }
      .title { fill:#152943; font-size:15px; font-weight:750; } .service-title { fill:#152943; font-size:13px; font-weight:750; } .small { fill:#566a83; font-size:11px; } .zone-title { fill:#497198; font-size:12px; font-weight:750; letter-spacing:.06em; } .arrow { stroke:#ff9900; stroke-width:2; fill:none; marker-end:url(#arrow); } .dashed { stroke-dasharray:6 5; } .control-link { stroke:#b5473c; stroke-width:1.5; fill:none; stroke-dasharray:5 5; } .label { fill:#8c5b00; font-size:10px; font-weight:650; }
      .callout { fill:#eff7f4; stroke:#a3d6c1; stroke-width:1; rx:8; } .callout-text { fill:#176047; font-size:10px; font-weight:650; }
      .footer { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:15px; }
      .pillar { padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:#fff; color:#4f627a; font-size:11px; line-height:1.4; } .pillar strong { display:block; margin-bottom:3px; color:var(--ink); font-size:12px; }
      @media print { @page { size:16in 10in; margin:0; } main { width:16in; min-height:10in; padding:.42in .55in; } }
    </style>
